[package]
name = "bsv-chaintracks-cloudflare"
version = "0.6.0"
description = "A BSV block-header service on Cloudflare Workers: D1 header storage, R2 bulk export, a chain-event feed."
license = "MIT"
repository = "https://github.com/Calhooon/chaintracks-cloudflare"
readme = "README.md"
keywords = ["bitcoin", "bsv", "chaintracks", "cloudflare", "wasm"]
categories = ["cryptography::cryptocurrencies"]
edition = "2021"
# The sources with their test fixtures (each under a megabyte), the migrations
# and wrangler.toml the tests read, the docs the README links, the records.
include = [
    "src/**/*.rs",
    "src/testdata/*",
    "build.rs",
    "migrations/*.sql",
    "wrangler.toml",
    "docs/*.md",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
# The crates.io name is bsv-chaintracks-cloudflare; the library keeps its
# identifier so no `use` path moves.
name = "rust_chaintracks"
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.7", features = ["d1"] }
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
hex = "0.4"
url = "2"
# The chain primitives (the header frame, the compact target, chain work,
# sha256d) and the difficulty rule are bsv-rs's; the caret, one bsv-rs per lock.
bsv-rs = { version = "0.8.1", default-features = false, features = ["block"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# Dev-only: the header query shapes are planned on a real SQLite with the real
# migrations (storage.rs plan pins). Never compiled into the worker.
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
chrono = "0.4"
