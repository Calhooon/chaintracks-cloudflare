# Publish bsv-chaintracks-cloudflare on a v* tag through crates.io trusted
# publishing (bsv-stack-lean docs/PUBLIC-PREP.md 3c): no token is stored; the
# OIDC exchange mints a short-lived one for the publish step alone.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check version and main ancestry
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "tag must equal the manifest version"
          print(f"release version: {version}")
          PY
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  # The whole Worker gate (test, fmt, clippy, wasm32, worker) on the tag.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.95.0'
      # The library builds natively (the host tests run on it), so the package
      # is verified on the host target; the wasm32 build is the ci job's.
      - name: Verify package
        run: cargo publish --dry-run
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
