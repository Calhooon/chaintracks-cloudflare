# Shared Worker gate: PR head, read-only token, pinned Rust, cached cargo.
# Host clippy covers all targets; wasm clippy covers libraries because SQLite dev tests are native.
name: ci
'on':
  pull_request: null
  workflow_call: null
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - run: cargo test --no-fail-fast
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - run: cargo fmt --all -- --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings
  wasm32:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - run: cargo install worker-build@0.7.5 --locked
    - run: worker-build --release
  worker:
    env:
      # the bootstrap witness caches its two bulk files under the target dir (tests/worker_bootstrap.mjs)
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    name: worker
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: cargo install worker-build@0.7.5 --locked
    - run: worker-build --release
    - run: npm install --prefix "$RUNNER_TEMP/worker-gate-node" --no-save --package-lock=false miniflare@4.20260426.0
    - run: |
        export MINIFLARE_MODULE="$RUNNER_TEMP/worker-gate-node/node_modules/miniflare/dist/src/index.js"
        export LANE32_WITNESS_FILE="$RUNNER_TEMP/chain-events.json"
        rm -f "$LANE32_WITNESS_FILE"
        cargo test --lib chain_event_tests::scenario_announced_nobody_hears_has_a_versioned_reorg --no-fail-fast -- --exact
        test -s "$LANE32_WITNESS_FILE"
        # worker_events.mjs runs both chain-event feeds itself; the others run under each.
        node tests/worker_events.mjs "$LANE32_WITNESS_FILE" || exit
        for feed in 1 2; do
          for test in tests/worker_*.mjs; do
            [ "$test" = tests/worker_events.mjs ] && continue
            CHAIN_EVENT_FEED=$feed node "$test" || exit
          done
        done
  scrub:
    name: scrub
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: tools/scrub.sh
